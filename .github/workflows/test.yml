name: Test

# `workflow_dispatch` 不是装饰：这个 fork 上 `on: push` 从来没有产出过一趟 run
# （Test 与 plugin-sdk 各自 total_count=0，全仓 18 趟 run 全是 workflow_dispatch；
# 同一份工作流在上游有 636 趟 push run）。少这一行，下面所有步骤——包括
# `Test · scripts（node:test）`——就只是文件里的一段话，谁也跑不到它。
# 判据在 src/main/scripts-test-gate.test.ts 的 E 条。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      # Windows runner 镜像把 `core.autocrlf` 设成 true，而本仓没有 `.gitattributes`——
      # 于是 checkout 会把 LF 的 blob 换成 CRLF 的工作树，凡是「读源码原文再按 `\n` 匹配」的
      # 断言就在 CI 上与本机读成两副样子。2026-11-01 实测到第一颗：
      # `src/main/verge/core-ipc.test.ts` 里 `canSwap,\n coreDir,` 那条本机绿、CI 红
      # （收到的正文是 `/**\r\n * 内核宿主的装配层…`）。判据在 src/main/eol-fragile-assertion.test.ts。
      # 2026-11-02 第一趟现场（run 41325952342）读出两件：镜像那颗 true 钉在 **system 层**，
      # `--global` 那行打出来是空的——所以只看 global 读数会误以为「镜像没设过」；真正能看见它的是
      # 不带 `--global` 的生效值。echo 只当诊断用，起作用的门是下一步数 CR。
      - name: Pin checkout EOL to the stored blobs
        run: |
          echo "effective value: $(git config core.autocrlf)"
          echo "global value: $(git config --global core.autocrlf)"
          git config --global core.autocrlf false
          echo "pinned value: $(git config --global core.autocrlf)"

      - uses: actions/checkout@v7

      # 钉子失效有两条路：镜像改了默认，或有人加 `.gitattributes` 把 eol 设成 crlf。
      # 与其让「读盘原文」的断言在几千条里再猜一次，不如在任何一个断言跑之前先把 CR 数出来。
      # 2026-11-02 起这里数两层：三份文件逐字节数 CR（读数跨趟可比），
      # 再用 `git ls-files --eol` 做全仓普查——判据是「解包后一个 `i/lf → w/crlf` 都不许有」，
      # 抽样的天花板在这里说清：全仓 2923 行里只点过 3 份，剩下 2920 份没人看过；而这把尺量的正是 checkout 这个动作。
      # 这一位的存在与位次由 src/main/eol-fragile-assertion.test.ts 的 D 档钉着。
      - name: Census the checked-out line endings
        run: >-
          node -e "const fs=require('fs');const cp=require('child_process');
          const names=['src/main/verge/core-bootstrap.ts','src/main/eol-fragile-assertion.test.ts','.github/workflows/test.yml'];
          let bad=0; for(const n of names){ const cr=fs.readFileSync(n,'utf8').split('\r').length-1;
          console.log('CR='+cr+'  '+n); if(cr>0) bad++; }
          const rows=cp.execSync('git ls-files --eol',{maxBuffer:67108864}).toString('utf8').split(/\r?\n/).filter((x) => x.trim());
          let flip=0; for(const r of rows){ const t=r.trim().split(/\s+/); if(t[0]==='i/lf'&&t[1]==='w/crlf') flip++; }
          console.log('TREE rows='+rows.length+'  i/lf->w/crlf='+flip);
          if(bad||flip){ console.error('checked-out tree has CRLF: the autocrlf pin is not holding'); process.exit(1); }
          console.log('EOL CENSUS OK '+names.length+' files CR=0 tree='+rows.length)"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Electron installation
        run: pnpm exec electron --version

      # 生产依赖审计：高危基线清零或限期登记前仅留存报告，不阻断合入。
      # 处置清单见 docs/refactor/2026-09-14-dependency-audit-baseline.md；
      # 基线清零后把本步骤改为 pnpm audit --prod --audit-level=high 并移除 continue-on-error。
      - name: Audit production dependencies
        run: pnpm audit --prod --json > pnpm-audit-prod.json
        continue-on-error: true

      - name: Upload production dependency audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pnpm-audit-prod
          path: pnpm-audit-prod.json

      - name: Build
        run: pnpm run build

      - name: Check model declarations and adapted models catalog
        run: pnpm run check:adapted-models

      # 插件清单契约检查：源码类型与 manifest.schema.json 保持一致
      - name: Check plugin schema contract
        run: pnpm run check:plugin-schema

      # 身份 / 色板 / 名册 / 位图资产的一致性门（全部是生成器 --check，漂移即红）。
      # 与 vitest 里的静态锁互补：那几把锁读解析后的字段，这几条读**生成物逐字节**；
      # cat-sprites --check 还带像素尺（同图/空图/错色都红），是「表情包与猫同一套 DrawOp」的证。
      - name: Check brand / palette / roster / sprites
        run: |
          pnpm run check:brand
          pnpm run palette:check
          pnpm run palette:migrate:check
          pnpm run check:roster
          pnpm run check:sprites

      # 分块测试：与 vitest.config.mts 的 include 对应，各步骤之和不重不漏覆盖全部测试文件
      # （已用 vitest list 逐一核对；filter 带尾斜杠、exclude 用根相对路径避免前缀误匹配）。
      # 拆成多个独立步骤是为了 CI 上出现 fork worker 崩溃时能一眼定位目录
      # （此前单步骤只有 “Worker exited unexpectedly”，无法判断死在哪）。
      - name: Test · src / plugins + shared + cli
        run: pnpm exec vitest run src/plugins src/shared src/cli
      - name: Test · src / renderer
        run: pnpm exec vitest run src/renderer
      - name: Test · main / orchestrator
        run: pnpm exec vitest run src/main/orchestrator
      - name: Test · main / moments + music
        run: pnpm exec vitest run src/main/moments src/main/music
      - name: Test · main / memory + rag
        run: pnpm exec vitest run src/main/memory src/main/rag
      - name: Test · main / channels
        run: pnpm exec vitest run src/main/channels
      - name: Test · main / platform（app / plugins / tts / cita / skills / scheduler / proactive / chats）
        run: pnpm exec vitest run src/main/tts/ src/main/plugin-host/ src/main/application/ src/main/cita/ src/main/skills/ src/main/scheduler/ src/main/proactive/ src/main/chats/
      - name: Test · main / core（其余）
        run: pnpm exec vitest run src/main --exclude "src/main/orchestrator/**" --exclude "src/main/moments/**" --exclude "src/main/music/**" --exclude "src/main/memory/**" --exclude "src/main/rag/**" --exclude "src/main/channels/**" --exclude "src/main/tts/**" --exclude "src/main/plugin-host/**" --exclude "src/main/application/**" --exclude "src/main/cita/**" --exclude "src/main/skills/**" --exclude "src/main/scheduler/**" --exclude "src/main/proactive/**" --exclude "src/main/chats/**"
      - name: Test · packages + skills + poc
        # packages 的 include 目前在 vitest.config.mts 中临时禁用（windows-2025 镜像下
        # fork worker 静默崩溃，改由 plugin-sdk workflow 单独验证），skills / cline-poc
        # 暂无测试文件，因此允许空跑；packages 恢复或新增测试后本步骤自动生效。
        run: pnpm exec vitest run --exclude "src/**" --passWithNoTests

      # scripts 下那几颗 node:test 文件（构建守卫 / 打包配置 / mingit+mpv 摘要校验 / 录制尺）
      # 写的是 node:test API，vitest 的 include 白名单一条都不含它们，上面的分块步骤全绿也
      # 碰不到它们——所以这一趟单独由 node 自带的 runner 跑。src/main/scripts-test-gate.test.ts
      # 钉着「这一步存在」与「scripts 里没有掉在两个 runner 之外的测试文件」。
      #
      # `if: !cancelled()` 不是排版：同一个 job 里任一步红，后面的步整片被标 skipped——
      # 2026-11-01 两趟实测就是这样：第 15 步红 ⇒ 16-22 skipped，第 20 步红 ⇒ 21-22 skipped，
      # 而这一步恰好在最后一位，所以它永远领不到自己的读数。它守的是「别的步骤碰不到的文件」，
      # 上面红没红跟它的判据无关，所以它必须自己报一次结论（job 仍按各步结论合成为红）。
      - name: Test · scripts（node:test）
        if: ${{ !cancelled() }}
        run: pnpm run test:scripts
